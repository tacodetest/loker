name: Scrape lowongan Glints

on:
  schedule:
    - cron: "0 5,17 * * *"
  workflow_dispatch:
    inputs:
      owner_id:
        description: Username pemilik tautan yang akan diproses (opsional)
        required: false
        type: string
      source_url:
        description: URL pencarian Glints yang akan diproses segera (opsional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: scrape-glints
  cancel-in-progress: false

jobs:
  scrape-glints:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCRAPE_OWNER_ID: ${{ inputs.owner_id }}
      SCRAPE_SOURCE_URL: ${{ inputs.source_url }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Simpan cache Chromium Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Pasang Chromium Playwright
        run: npx playwright install --with-deps chromium
      - name: Ambil lowongan Glints
        run: npm run scrape
      - name: Unggah HTML debug Glints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-debug-glints-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verifikasi data Glints
        if: always()
        run: npm run verify:scrape
